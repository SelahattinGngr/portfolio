spring.application.name=portfolio
# Server configuration
server.port=5353

# Security configuration
spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}
spring.security.user.roles=ADMIN,USER

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# h2 console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# jwt
selahattindev.jwt.accessSecretKey=${JWT_ACCESS_SECRET_KEY}
selahattindev.jwt.refreshSecretKey=${JWT_REFRESH_SECRET_KEY} 
selahattindev.jwt.accessTokenExpirationMs=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
selahattindev.jwt.refreshTokenExpirationMs=${JWT_REFRESH_TOKEN_EXPIRATION_MS}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB_NAME}
spring.datasource.username=${POSTGRES_DB_USER}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always

spring.profiles.active=prod

